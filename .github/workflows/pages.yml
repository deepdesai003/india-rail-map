name: Build and publish map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download DataMeet Indian Railways data
        run: git clone --depth 1 https://github.com/datameet/railways.git /tmp/railways

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data files
        run: |
          mkdir -p _site
          python scripts/build_data.py /tmp/railways _site

      - name: Add page and Leaflet
        run: |
          cp web/index.html _site/index.html
          npm pack leaflet@1.9.4 --silent
          tar xzf leaflet-1.9.4.tgz
          cp package/dist/leaflet.js package/dist/leaflet.css _site/
          mkdir -p _site/images && cp package/dist/images/* _site/images/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
